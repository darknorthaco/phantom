[package]
name = "phantom_app"
version = "0.1.0"
description = "Phantom Distributed Compute Fabric — Sovereign Desktop Application"
authors = ["Dark North Co."]
edition = "2021"

[lib]
name = "phantom_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "fs", "net", "time", "sync", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
log = "0.4"
env_logger = "0.11"

